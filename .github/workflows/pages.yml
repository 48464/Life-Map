name: Deploy Life Map to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip all parts into one site folder
        run: |
          mkdir -p build
          for z in parts/*.zip; do unzip -q -o "$z" -d build; done
          test -f build/life-map/index.html
          echo "Mushaf pages: $(ls build/life-map/mushaf/QPC1 | wc -l)  Fonts: $(ls build/life-map/fonts/QPC1 | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/life-map
      - id: deployment
        uses: actions/deploy-pages@v4
